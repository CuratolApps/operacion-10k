name: "ÁREA 501 - Sniper Atómico 24/7 (Observadores + 32 Nebulosas + Disparo)"

on:
  schedule:
    # Despierta cada 5 minutos y corre en bucle continuo de 4.5 minutos (24/7 ininterrumpido)
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Ejecutar en modo simulación (Dry-Run)'
        required: false
        default: false
        type: boolean
      duration_sec:
        description: 'Duración del demonio en segundos (ej. 260)'
        required: false
        default: '260'

concurrency:
  group: sniper-24-7-daemon
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sniper-loop:
    name: "Bucle 24/7 · Observadores + 32 Nebulosas + Sniper Atómico"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TRUST_WALLET_SEED: ${{ secrets['TRUST_WALLET_SEED'] }}
      SWARM_MNEMONIC: ${{ secrets['SWARM_MNEMONIC'] }}
      POLYGON_RPC_URL: ${{ secrets['POLYGON_RPC_URL'] }}
      BNB_RPC_URL: ${{ secrets['BNB_RPC_URL'] }}
      TELEGRAM_BOT_TOKEN: ${{ secrets['TELEGRAM_BOT_TOKEN'] }}
      TELEGRAM_CHAT_ID: ${{ secrets['TELEGRAM_CHAT_ID'] || '-1004342131598' }}
      AUTO_SHOOTER_DRY: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}

    steps:
      - name: "📥 Clonar repositorio"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets['GITHUB_TOKEN'] }}

      - name: "⚙️ Configurar Node.js 24 LTS"
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: "📦 Instalar dependencias de forma resiliente"
        run: npm install --no-audit --no-fund

      - name: "🚀 Bucle Continuo - Observadores a 32 Nebulosas a Sniper"
        shell: bash
        run: |
          DUR="${{ github.event.inputs.duration_sec || '260' }}"
          echo "========================================================================="
          echo "🌌 INICIANDO BUCLE CONTINUO DE SNIPING ($DUR seg): ÁREA 501"
          echo "========================================================================="
          node scripts/sniper-continuous-daemon.js --duration "$DUR" --interval 3

      - name: "💾 Sincronizar telemetría hacia Git"
        if: always()
        shell: bash
        run: |
          git config user.name "Área 501 Sentinel"
          git config user.email "sentinel@area501.local"
          git pull --rebase origin main || true
          git add telemetry/*.json last-run-report.json || true
          git commit -m "chore(telemetry): sincronización continua 24/7 [skip ci]" || echo "Sin cambios en telemetría"
          git push origin main || echo "Push no requerido o ya sincronizado"
