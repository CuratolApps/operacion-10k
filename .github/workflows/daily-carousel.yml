name: Operación 10k - Daily Carousel Omnichain

on:
  schedule:
    # Ejecuta el carrusel rotativo cada 3 horas (8 ciclos orgánicos diarios)
    - cron: '30 */3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Ejecutar en modo simulación (Dry-Run)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  run-daily-carousel:
    name: Carrusel Omnichain 500 Satélites (Sepolia, Base, Arbitrum)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Configurar Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Instalar dependencias limpias
        run: npm ci

      - name: 🛰️ Generar lista de satélites públicos (501 cuentas)
        run: node swarm-engine.js --only-generate
        env:
          TRUST_WALLET_SEED: ${{ secrets.TRUST_WALLET_SEED }}
          SWARM_MNEMONIC: ${{ secrets.SWARM_MNEMONIC }}
          SWARM_SIZE: ${{ secrets.SWARM_SIZE || '501' }}

      - name: 🚀 Ejecutar Carrusel Omnichain Anti-Sybil
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "🧪 Ejecutando carrusel en modo Dry-Run."
            node task-runner.js --dry-run
          else
            echo "⚡ Ejecutando carrusel on-chain en vivo."
            node task-runner.js
          fi
        env:
          TRUST_WALLET_SEED: ${{ secrets.TRUST_WALLET_SEED }}
          SWARM_MNEMONIC: ${{ secrets.SWARM_MNEMONIC }}
          SWARM_SIZE: ${{ secrets.SWARM_SIZE || '501' }}
          BATCH_SIZE: '20'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: 📡 Ejecutar Radar Hunter & Reporte a Telegram
        run: node radar-hunter.js
        env:
          TRUST_WALLET_SEED: ${{ secrets.TRUST_WALLET_SEED }}
          SWARM_MNEMONIC: ${{ secrets.SWARM_MNEMONIC }}
          SWARM_SIZE: ${{ secrets.SWARM_SIZE || '501' }}
          BATCH_SIZE: '20'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
