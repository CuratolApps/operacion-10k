name: Operación 10k - Swarm Engine Automation

on:
  schedule:
    # Despierta automáticamente CADA HORA en el minuto 17 (24 veces al día)
    - cron: '17 * * * *'
  # Permite ejecución manual bajo demanda desde la pestaña Actions de GitHub
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Ejecutar en modo simulación (Dry-Run)'
        required: false
        default: false
        type: boolean

concurrency:
  group: swarm-engine-10k
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-swarm:
    name: Ejecutar Ronda de Enjambre Multi-Red
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Configurar Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Instalar dependencias limpias
        run: npm ci

      - name: 🛰️ Generar lista de satélites públicos (si no existe)
        run: node swarm-engine.js --only-generate
        env:
          TRUST_WALLET_SEED: ${{ secrets.TRUST_WALLET_SEED }}
          SWARM_SIZE: ${{ secrets.SWARM_SIZE || '501' }}

      - name: 🚀 Ejecutar Motor de Rutinas y Escudo Anti-Sybil
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Modo Dry-Run activado por usuario."
            node task-runner.js --dry-run
          else
            node task-runner.js
          fi
        env:
          TRUST_WALLET_SEED: ${{ secrets.TRUST_WALLET_SEED }}
          SWARM_SIZE: ${{ secrets.SWARM_SIZE || '501' }}
          BATCH_SIZE: '20'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: 📡 Ejecutar Radar Hunter & Auditoría de Flota
        run: node radar-hunter.js
        env:
          TRUST_WALLET_SEED: ${{ secrets.TRUST_WALLET_SEED }}
          SWARM_SIZE: ${{ secrets.SWARM_SIZE || '501' }}
          BATCH_SIZE: '20'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: 📊 Consolidar Telemetría Unificada para Dashboard & Gemini
        run: node scripts/ai-telemetry-feed.js
        env:
          SWARM_SIZE: ${{ secrets.SWARM_SIZE || '501' }}

      - name: 💾 Persistir Telemetría en Repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add telemetry/fleet-telemetry.json last-run-report.json radar-report.json || true
          if git diff --staged --quiet; then
            echo "No hay cambios para commitear"
          else
            git commit -m "telemetry: update fleet telemetry [skip ci]"
            git push origin HEAD || echo "Push omitido o sin cambios"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Guardar Artefacto de Telemetría
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleet-telemetry-snapshot
          path: |
            telemetry/fleet-telemetry.json
            last-run-report.json
            radar-report.json
          retention-days: 7