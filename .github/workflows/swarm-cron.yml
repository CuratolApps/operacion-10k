name: Operación 10k - Swarm Engine Automation

on:
  schedule:
    # Despierta automáticamente CADA 30 MINUTOS en el minuto 17 y 47 (48 veces al día)
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Ejecutar en modo simulación (Dry-Run)'
        required: false
        default: false
        type: boolean

concurrency:
  group: operacion-10k-main-swarm
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-swarm:
    name: Ejecutar Ronda de Enjambre Multi-Red
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      TRUST_WALLET_SEED: ${{ secrets.TRUST_WALLET_SEED }}
      SWARM_MNEMONIC: ${{ secrets.SWARM_MNEMONIC }}
      SWARM_SIZE: ${{ secrets.SWARM_SIZE || '500' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '-5101181644' }}
      VANGUARD_BOT_TOKEN: ${{ secrets.VANGUARD_BOT_TOKEN }}
      # 🛑 X/Twitter BLINDADO: sin credenciales X_* en este job mientras @yozapata está en revisión.

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Configurar Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 📦 Instalar dependencias de forma resiliente
        run: npm install --no-audit --no-fund

      - name: 🚀 Ejecutar Carrusel Omnichain + Radar 500 Satélites
        shell: bash
        run: |
          FAILED=""
          # Sin '|| true' silencioso: un fallo queda como anotación ::error:: visible en los logs.
          # La ronda continúa (para no perder telemetría ni el estado del cooldown) y el job falla al final.
          run_critical() {
            echo "::group::▶ $*"
            if "$@"; then code=0; else code=$?; fi
            echo "::endgroup::"
            if [ "$code" -ne 0 ]; then
              echo "::error title=Paso crítico falló::$* (exit $code)"
              FAILED="$FAILED | $*"
            fi
          }
          run_soft() {
            echo "::group::▶ $*"
            if "$@"; then code=0; else code=$?; fi
            echo "::endgroup::"
            if [ "$code" -ne 0 ]; then echo "::warning title=Paso opcional falló::$* (exit $code)"; fi
          }

          DRY=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi

          run_soft node swarm-engine.js --only-generate
          run_soft node solana-faucet-refuel.js
          run_critical node nebula-ai-commanders.js
          if [ -n "$DRY" ]; then
            run_critical node task-runner.js --force-dry-run
          else
            run_critical node task-runner.js
          fi
          run_critical node bot-miner-swarm.js $DRY
          run_critical node gamefi-bot-swarm.js
          run_critical node bounty-and-quota-engine.js $DRY
          run_critical node saturation-liquidity-engine.js $DRY
          run_soft node autonomous-brain-lomo5.js
          run_critical node gamefi-and-competitions.js $DRY
          run_critical node harvest-rewards.js --scan
          run_critical node master-refuel.js --intra-box
          run_soft node vanguard-hunter.js
          # node x-autonomous-agent.js # PAUSADO TEMPORALMENTE: revisión preventiva de cuenta en @yozapata
          run_critical node scripts/ai-telemetry-feed.js

          if [ -n "$FAILED" ]; then
            echo "::error title=Ronda con errores::Pasos críticos con fallo:$FAILED"
            exit 1
          fi

      - name: 💾 Sincronizar Telemetría al Dashboard
        if: always()
        run: |
          git config user.name "Operacion10K-Bot"
          git config user.email "bot@curatools.io"
          # mainnet-cooldown.json = estado del Modo Ahorro (1 turno/día UTC); el runner es efímero, debe viajar en git.
          git add telemetry/fleet-telemetry.json telemetry/telegram-alerts.json telemetry/mainnet-cooldowns.json radar-report.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(telemetry): live sync [skip ci]" || true
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin main && break
              echo "Reintento $attempt de sincronización..."; sleep 5
            done
          fi

      - name: 📦 Guardar Artefacto de Telemetría
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: fleet-telemetry-snapshot
          path: |
            telemetry/fleet-telemetry.json
            last-run-report.json
            radar-report.json
          retention-days: 7