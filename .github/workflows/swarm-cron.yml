name: Operación 10k - Swarm Engine Automation

on:
  schedule:
    # Despierta automáticamente CADA 30 MINUTOS en el minuto 17 y 47 (48 veces al día)
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Ejecutar en modo simulación (Dry-Run)'
        required: false
        default: false
        type: boolean

concurrency:
  group: operacion-10k-main-swarm
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-swarm:
    name: Ejecutar Ronda de Enjambre Multi-Red
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      TRUST_WALLET_SEED: ${{ secrets.TRUST_WALLET_SEED }}
      SWARM_MNEMONIC: ${{ secrets.SWARM_MNEMONIC }}
      SWARM_SIZE: ${{ secrets.SWARM_SIZE || '500' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '-5101181644' }}
      VANGUARD_BOT_TOKEN: ${{ secrets.VANGUARD_BOT_TOKEN }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
      X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Configurar Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 📦 Instalar dependencias de forma resiliente
        run: npm install --no-audit --no-fund

      - name: 🚀 Ejecutar Carrusel Omnichain + Radar 500 Satélites
        run: |
          node swarm-engine.js --only-generate || true
          node solana-faucet-refuel.js || true
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node task-runner.js --dry-run || true
          else
            node task-runner.js || true
          fi
          node bot-miner-swarm.js || true
          node bounty-and-quota-engine.js || true
          node autonomous-brain-lomo5.js || true
          node harvest-rewards.js --scan || true
          node master-refuel.js --intra-box || true
          node vanguard-hunter.js || true
          # node x-autonomous-agent.js || true # PAUSADO TEMPORALMENTE: revisión preventiva de cuenta en @yozapata
          node scripts/ai-telemetry-feed.js || true

      - name: 💾 Sincronizar Telemetría al Dashboard
        run: |
          git config user.name "Operacion10K-Bot"
          git config user.email "bot@curatools.io"
          git add telemetry/fleet-telemetry.json telemetry/telegram-alerts.json radar-report.json || true
          git diff --staged --quiet || (git commit -m "chore(telemetry): live sync [skip ci]" && git pull --rebase origin main && git push origin main) || true

      - name: 📦 Guardar Artefacto de Telemetría
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: fleet-telemetry-snapshot
          path: |
            telemetry/fleet-telemetry.json
            last-run-report.json
            radar-report.json
          retention-days: 7