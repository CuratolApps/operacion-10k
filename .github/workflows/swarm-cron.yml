name: "ÁREA 501 - Swarm Engine Automation"

on:
  schedule:
    # 8 Vueltas Diarias Exactas: 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00 y 21:00 UTC
    - cron: '0 0,3,6,9,12,15,18,21 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Ejecutar en modo simulación (Dry-Run)'
        required: false
        default: false
        type: boolean
  workflow_call:
    secrets:
      TRUST_WALLET_SEED:
        required: false
      SWARM_MNEMONIC:
        required: false
      SWARM_SIZE:
        required: false
      POLYGON_RPC_URL:
        required: false
      BNB_RPC_URL:
        required: false
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false
      VANGUARD_BOT_TOKEN:
        required: false

concurrency:
  group: area-501-main-swarm
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-swarm:
    name: "Ejecutar Ronda de Enjambre Multi-Red"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TRUST_WALLET_SEED: ${{ secrets.TRUST_WALLET_SEED || '' }}
      SWARM_MNEMONIC: ${{ secrets.SWARM_MNEMONIC || '' }}
      SWARM_SIZE: ${{ secrets.SWARM_SIZE || '500' }}
      POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL || 'https://polygon-rpc.com' }}
      BNB_RPC_URL: ${{ secrets.BNB_RPC_URL || 'https://bsc-dataseed.binance.org/' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '' }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '-1004342131598' }}
      VANGUARD_BOT_TOKEN: ${{ secrets.VANGUARD_BOT_TOKEN || '' }}
      # 🛑 X/Twitter BLINDADO: sin credenciales X_* en este job mientras @yozapata está en revisión.

    steps:
      - name: "📥 Clonar repositorio"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ github.token }}

      - name: "⚙️ Configurar Node.js 24 LTS"
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: "📦 Instalar dependencias de forma resiliente"
        run: npm install --no-audit --no-fund

      - name: "🚀 Ejecutar Carrusel Omnichain + Radar 500 Satélites"
        shell: bash
        run: |
          run_safe() {
            echo "::group::▶ $*"
            timeout 180s "$@" || true
            echo "::endgroup::"
          }

          DRY=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi

          # 1. 🏛️ Mando Central & Auditoría On-Chain
          run_safe node scripts/audit-onchain-balances.js
          run_safe node swarm-engine.js --only-generate
          run_safe node scripts/auto-refill-and-swap.js
          run_safe node dedicated-observers.js

          # 2. 🎯 Sniping Atómico Multi-Piscina (AtomicSniperExecutor 0x03Ac...6b67)
          run_safe node atomic-profit-guard.js
          run_safe node scripts/atomic-auto-shooter.js --passes 2 --interval 25
          run_safe node security-fortress-shield.js
          run_safe node omni-sniper-5models.js
          run_safe node nebula-ai-commanders.js
          run_safe node expert-captains-command.js
          run_safe node dual-capitalizer-engine.js

          # 3. 🪖 Flota X500 (500 Carteras, Airdrops & Semillas)
          run_safe node seed-airdrop-engine.js
          run_safe node live-launch-calendar-hunter.js
          run_safe node annual-calendar-oracle.js
          run_safe node dynamic-box-dispatcher.js
          run_safe node bounty-booty-commander.js

          # 🪖 BARRIDO COMPLETO DE 500 CARTERAS + REPORTE OFICIAL DE VUELTA (1 A 8)
          run_safe node scripts/execute-full-500-sweep.js

          run_safe node bot-miner-swarm.js $DRY
          run_safe node bounty-and-quota-engine.js $DRY
          run_safe node saturation-liquidity-engine.js $DRY
          run_safe node autonomous-brain-lomo5.js
          run_safe node sniper-501-mainnet.js --scan
          run_safe node harvest-rewards.js --scan
          run_safe node master-refuel.js --intra-box
          run_safe node vanguard-hunter.js
          run_safe node scripts/onchain-snapshot.js
          run_safe node scripts/ai-telemetry-feed.js

          echo "✅ [SWARM-CRON]: Ronda omnichain ejecutada con timeouts seguros de 180s por paso."

      - name: "💾 Sincronizar Telemetría al Dashboard"
        if: always()
        run: |
          git config user.name "ÁREA 501 Sentinel"
          git config user.email "sentinel@area501.local"
          git add telemetry/ last-run-report.json balances-report.json radar-report.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(telemetry): live sync [skip ci]" || true
            for attempt in 1 2 3; do
              git pull --rebase -X ours origin main || true
              git push origin main && break
              echo "Reintento $attempt de sincronización..."; sleep 5
            done
          fi

      - name: "📦 Guardar Artefacto de Telemetría"
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: fleet-telemetry-snapshot
          path: |
            telemetry/squad-secret-telemetry.json
            telemetry/fleet-telemetry.json
            telemetry/fleet-rounds-telemetry.json
            telemetry/gasless-checkins-today.json
            telemetry/annual-airdrop-calendar.json
            telemetry/box-dispatch-plan.json
            telemetry/trading-telemetry.json
            telemetry/squad-secret-real-ledger.json
            last-run-report.json
            radar-report.json
          retention-days: 7